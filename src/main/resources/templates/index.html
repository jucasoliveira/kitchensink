<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>kitchensink</title></head>
<body>
<h1>Members</h1>
<table>
    <tr th:each="m : ${members}">
        <td th:text="${m.name()}">name</td>
        <td th:text="${m.email()}">email</td>
        <td th:text="${m.address()?.city()}">city</td>
    </tr>
</table>
</body>
</html>
