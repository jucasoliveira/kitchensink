# Issue 1.10. Issue 1.2 set this to false so the rules could be asserted "before there is code to
# violate them"; the customer slice (1.7-1.9) has landed, so an empty should-clause is once again
# what it means by default: a package got renamed and a rule silently stopped doing anything.
#
# `true` is ArchUnit's default. It is spelled out here so the decision is greppable, and so that
# the one rule that still legitimately matches nothing - the JPA adapter's, until 3.3 / 4.6 write
# that package - carries its own allowEmptyShould(true) next to the reason, rather than the whole
# rule set being quietly exempt.
archRule.failOnEmptyShould=true
