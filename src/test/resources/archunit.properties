# Issue 1.2 asks for the dependency rules to be asserted "before there is code to violate them",
# so at the point they are introduced almost every rule matches zero classes. ArchUnit fails an
# empty should-clause by default, on the reasonable assumption that an empty rule is a typo.
#
# Here it is not a typo, it is the schedule: the rules land in 1.2 and the packages fill up from
# E3/E4 onwards. Flip this back to true (or delete the file) once the customer slice has landed,
# at which point an empty rule really would mean a package got renamed and a rule silently stopped
# doing anything.
archRule.failOnEmptyShould=false
